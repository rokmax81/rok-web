name: Actualizar indicadores

on:
  schedule:
    # Lunes a viernes 21:40 UTC (18:40 Buenos Aires), después del cierre de Wall Street.
    - cron: "40 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/*.py"
      - ".github/workflows/indicadores.yml"

permissions:
  contents: write

concurrency:
  group: indicadores
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install yfinance pandas requests

      - name: Indicadores (sección 1)
        run: python scripts/actualizar_indicadores.py
        continue-on-error: true
        timeout-minutes: 5

      - name: Tasas de EE.UU. (sección 2)
        run: python scripts/actualizar_tasas.py
        continue-on-error: true
        timeout-minutes: 5

      - name: Guardar cambios
        run: |
          git config user.name "rok-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indicadores.json data/tasas.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos al $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
