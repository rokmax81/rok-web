name: Actualizar indicadores

on:
  schedule:
    # Lunes a viernes 19:00 hora de Nueva York (ET). GitHub solo acepta UTC, así que
    # hay dos horarios: 23:00 UTC (horario de verano, EDT) y 00:00 UTC del día
    # siguiente (horario estándar, EST). El job "hora" deja correr solo el que corresponde.
    - cron: "0 23 * * 1-5"
    - cron: "0 0 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/*.py"
      - ".github/workflows/indicadores.yml"

permissions:
  contents: write

concurrency:
  group: indicadores
  cancel-in-progress: false

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.chequeo.outputs.correr }}
    steps:
      - id: chequeo
        env:
          EVENTO: ${{ github.event_name }}
          HORARIO: ${{ github.event.schedule }}
        run: |
          correr=true
          if [ "$EVENTO" = "schedule" ]; then
            zona=$(TZ=America/New_York date +%Z)
            if [ "$zona" = "EDT" ] && [ "$HORARIO" != "0 23 * * 1-5" ]; then correr=false; fi
            if [ "$zona" = "EST" ] && [ "$HORARIO" != "0 0 * * 2-6" ]; then correr=false; fi
            echo "Zona: $zona, horario: $HORARIO, corre: $correr"
          fi
          echo "correr=$correr" >> "$GITHUB_OUTPUT"

  actualizar:
    needs: hora
    if: needs.hora.outputs.correr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install yfinance pandas requests

      - name: Indicadores (sección 1)
        run: python scripts/actualizar_indicadores.py
        continue-on-error: true
        timeout-minutes: 5

      - name: Tasas de EE.UU. (sección 2)
        run: python scripts/actualizar_tasas.py
        continue-on-error: true
        timeout-minutes: 5

      - name: Guardar cambios
        run: |
          git config user.name "rok-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indicadores.json data/tasas.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos al $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
